<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${modoEdicion} ? 'Editar Usuario' : 'Nuevo Usuario'"></title>

    <style>
        body {
            font-family:'Segoe UI';
            background: linear-gradient(135deg,#0f2027,#203a43,#2c5364);
            display:flex;
            justify-content:center;
            align-items:center;
            height:100vh;
        }

        .card {
            background:white;
            padding:30px;
            border-radius:16px;
            width:400px;
        }

        .input-group { margin-bottom:15px; }

        input, select {
            width:100%;
            padding:12px;
            border-radius:8px;
            border:1px solid #ccc;
            box-sizing: border-box;
        }

        input:focus, select:focus {
            border:1px solid #1565c0;
            outline:none;
        }

        .btn {
            padding:12px;
            width:100%;
            border:none;
            border-radius:8px;
            font-weight:bold;
            cursor:pointer;
        }

        .btn-guardar {
            background: linear-gradient(45deg,#1e88e5,#1565c0);
            color:white;
        }

        .btn-guardar:hover { transform:scale(1.02); }

        .btn-volver {
            background:gray;
            color:white;
            display:block;
            text-align:center;
            margin-top:10px;
            padding:12px;
            border-radius:8px;
            text-decoration:none;
        }

        h2 {
            text-align:center;
            color:#1565c0;
            margin-bottom:20px;
        }
    </style>
</head>

<body>

<div class="card">

    <h2 th:text="${modoEdicion} ? 'Editar Usuario' : 'Nuevo Usuario'"></h2>

    <form th:action="${modoEdicion} ? @{/usuarios/actualizar/{id}(id=${usuarios.codigoUsuario})} : @{/usuarios/guardar}"
          th:object="${usuarios}" method="post">

        <input type="hidden" th:field="*{codigoUsuario}"/>

        <div class="input-group">
            <input type="text" th:field="*{username}" placeholder="Username" required>
        </div>

        <div class="input-group">
            <input type="password" th:field="*{password}" placeholder="Password" required>
        </div>

        <div class="input-group">
            <input type="email" th:field="*{email}" placeholder="Email">
        </div>

        <div class="input-group">
            <select th:field="*{rol}">
                <option value="">Seleccione rol</option>
                <option value="ADMIN">ADMIN</option>
                <option value="USER">USER</option>
            </select>
        </div>

        <div class="input-group">
            <select th:field="*{estado}">
                <option th:value="true">Activo</option>
                <option th:value="false">Inactivo</option>
            </select>
        </div>

        <button type="submit" class="btn btn-guardar"
                th:text="${modoEdicion} ? 'Actualizar' : 'Guardar'"></button>

        <a th:href="@{/usuarios}" class="btn-volver">Volver</a>

    </form>

</div>

</body>
</html>
