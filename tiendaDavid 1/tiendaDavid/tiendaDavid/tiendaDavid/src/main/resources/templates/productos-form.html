<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${modoEdicion} ? 'Editar Producto' : 'Nuevo Producto'"></title>
    <style>
        body { font-family:'Segoe UI'; background:linear-gradient(135deg,#0f2027,#203a43,#2c5364); display:flex; justify-content:center; align-items:center; height:100vh; }
        .card { background:white; padding:30px; border-radius:16px; width:400px; }
        .input-group { margin-bottom:12px; }
        input, select { width:100%; padding:12px; border-radius:8px; border:1px solid #ccc; box-sizing:border-box; }
        button { width:100%; padding:12px; background:#1565c0; color:white; border:none; border-radius:8px; font-weight:bold; cursor:pointer; }
        .btn-volver { display:block; text-align:center; margin-top:10px; color:white; background:gray; padding:10px; border-radius:8px; text-decoration:none; }
        h2 { text-align:center; color:#1565c0; margin-bottom:20px; }
    </style>
</head>
<body>
<div class="card">
    <h2 th:text="${modoEdicion} ? 'Editar Producto' : 'Nuevo Producto'"></h2>
    <form th:object="${productos}" method="post"
          th:action="${modoEdicion} ? @{/productos/actualizar/{id}(id=${productos.codigoProducto})} : @{/productos/guardar}">

        <input type="hidden" th:field="*{codigoProducto}"/>

        <!-- CORREGIDO: campos reales de la entidad -->
        <div class="input-group">
            <input type="text" placeholder="Nombre del producto" th:field="*{nombreProducto}" required>
        </div>
        <div class="input-group">
            <input type="number" step="0.01" placeholder="Precio" th:field="*{precio}" required>
        </div>
        <div class="input-group">
            <input type="number" placeholder="Stock" th:field="*{stock}" required>
        </div>
        <div class="input-group">
            <select th:field="*{estado}">
                <option th:value="true">Activo</option>
                <option th:value="false">Inactivo</option>
            </select>
        </div>

        <button type="submit" th:text="${modoEdicion} ? 'Actualizar' : 'Guardar'"></button>
        <a th:href="@{/productos}" class="btn-volver">Volver</a>
    </form>
</div>
</body>
</html>
