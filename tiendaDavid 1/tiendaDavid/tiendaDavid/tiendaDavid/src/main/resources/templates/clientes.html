<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Clientes</title>
    <style>
        body { font-family:'Segoe UI',sans-serif; margin:0; padding:40px; background:linear-gradient(135deg,#0f2027,#203a43,#2c5364); }
        h1 { text-align:center; color:white; margin-bottom:25px; }
        .card { background:rgba(255,255,255,0.95); border-radius:16px; padding:25px; box-shadow:0 10px 30px rgba(0,0,0,0.3); }
        .btn { padding:10px 18px; border-radius:8px; color:white; text-decoration:none; font-weight:bold; margin-right:5px; }
        .btn-nuevo { background:#1e88e5; }
        .btn-editar { background:#42a5f5; }
        .btn-eliminar { background:#e53935; }
        .btn-regreso { background:#4caf50; }
        table { width:100%; margin-top:20px; border-collapse:collapse; }
        th, td { padding:12px; text-align:center; }
        th { background:#1565c0; color:white; }
        tr:nth-child(even) { background:#f5f5f5; }
    </style>
</head>
<body>
<h1>Lista de Clientes</h1>
<div class="card">
    <a th:href="@{/clientes/nuevo}" class="btn btn-nuevo">+ Nuevo Cliente</a>
    <table>
        <thead>
        <tr>
            <th>DPI</th>
            <th>Nombre</th>
            <th>Apellido</th>
            <th>Dirección</th>
            <th>Estado</th>
            <th>Acciones</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="cliente : ${clientes}">
            <!-- CORREGIDO: campos reales de la entidad -->
            <td th:text="${cliente.dpiCliente}"></td>
            <td th:text="${cliente.nombreCliente}"></td>
            <td th:text="${cliente.apellidoCliente}"></td>
            <td th:text="${cliente.direccion}"></td>
            <td th:text="${cliente.estado} ? 'Activo' : 'Inactivo'"></td>
            <td>
                <!-- CORREGIDO: variable cliente en lugar de c -->
                <a th:href="@{/clientes/actualizar/{id}(id=${cliente.dpiCliente})}" class="btn btn-editar">Editar</a>
                <a th:href="@{/clientes/eliminar/{id}(id=${cliente.dpiCliente})}"
                   class="btn btn-eliminar"
                   onclick="return confirm('¿Eliminar cliente?')">Eliminar</a>
            </td>
        </tr>
        </tbody>
    </table>
    <br>
    <a th:href="@{/home}" class="btn btn-regreso">Volver a Home</a>
</div>
</body>
</html>
