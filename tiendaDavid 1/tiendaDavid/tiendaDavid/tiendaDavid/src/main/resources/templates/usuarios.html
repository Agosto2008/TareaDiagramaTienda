<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Usuarios</title>

    <style>
        body { font-family: 'Segoe UI', sans-serif; margin:0; padding:40px; background: linear-gradient(135deg,#0f2027,#203a43,#2c5364); }
        h1 { text-align:center; color:white; margin-bottom:25px; }
        .card { background: rgba(255,255,255,0.95); border-radius:16px; padding:25px; box-shadow:0 10px 30px rgba(0,0,0,0.3); backdrop-filter:blur(10px); }
        .btn { padding:10px 18px; border-radius:8px; color:white; text-decoration:none; font-weight:bold; transition:all 0.3s ease; display:inline-block; margin-right:5px; }
        .btn-nuevo { background: linear-gradient(45deg,#1e88e5,#42a5f5); }
        .btn-editar { background: linear-gradient(45deg,#42a5f5,#1e88e5); }
        .btn-eliminar { background: linear-gradient(45deg,#ef5350,#c62828); }
        .btn-regreso { background: linear-gradient(45deg,#4caf50,#388e3c); }
        table { width:100%; margin-top:20px; border-collapse:collapse; border-radius:12px; overflow:hidden; }
        th, td { text-align:center; padding:12px; }
        th { background:#1565c0; color:white; }
        td { background:white; border-bottom:1px solid #eee; }
        tr:hover td { background:#e3f2fd; transform:scale(1.01); }
    </style>
</head>

<body>

<h1>Lista de Usuarios</h1>

<div class="card">

    <a th:href="@{/usuarios/nuevo}" class="btn btn-nuevo">+ Nuevo Usuario</a>

    <table>
        <thead>
        <tr>
            <th>ID</th>
            <th>Username</th>
            <th>Email</th>
            <th>Rol</th>
            <th>Estado</th>
            <th>Acciones</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="usuario : ${usuarios}">
            <td th:text="${usuario.codigoUsuario}"></td>
            <td th:text="${usuario.username}"></td>
            <td th:text="${usuario.email}"></td>
            <td th:text="${usuario.rol}"></td>
            <td th:text="${usuario.estado} ? 'Activo' : 'Inactivo'"></td>
            <td>
                <a th:href="@{/usuarios/editar/{id}(id=${usuario.codigoUsuario})}" class="btn btn-editar">Editar</a>
                <a th:href="@{/usuarios/eliminar/{id}(id=${usuario.codigoUsuario})}" class="btn btn-eliminar"
                   onclick="return confirm('¿Eliminar usuario?')">Eliminar</a>
            </td>
        </tr>
        </tbody>
    </table>

    <br>
    <a th:href="@{/home}" class="btn btn-regreso">Volver a home</a>

</div>

</body>
</html>
