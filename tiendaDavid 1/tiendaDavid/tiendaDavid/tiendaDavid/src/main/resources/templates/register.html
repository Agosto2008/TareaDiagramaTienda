<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Registro</title>

    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            margin:0;
            padding:0;
            height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            background: linear-gradient(135deg,#0f2027,#203a43,#2c5364);
        }

        .card {
            background: rgba(255,255,255,0.95);
            padding:30px;
            border-radius:16px;
            width:420px;
            box-shadow:0 10px 30px rgba(0,0,0,0.4);
        }

        h2 {
            text-align:center;
            color:#1565c0;
            margin-bottom:20px;
        }

        .input-group {
            margin-bottom:12px;
        }

        input {
            width:100%;
            padding:12px;
            border-radius:8px;
            border:1px solid #ccc;
            outline:none;
        }

        input:focus {
            border:1px solid #1565c0;
            box-shadow:0 0 5px rgba(21,101,192,0.3);
        }

        .error-text {
            font-size:12px;
            color:#e53935;
            margin-top:3px;
            margin-bottom:8px;
        }

        .btn {
            width:100%;
            padding:12px;
            border:none;
            border-radius:8px;
            font-weight:bold;
            cursor:pointer;
            transition:0.3s;
        }

        .btn-guardar {
            background: linear-gradient(45deg,#1e88e5,#1565c0);
            color:white;
        }

        .btn-guardar:hover {
            transform:scale(1.03);
        }

        .btn-volver {
            display:block;
            text-align:center;
            margin-top:10px;
            padding:10px;
            border-radius:8px;
            background:#4caf50;
            color:white;
            text-decoration:none;
        }

        .top {
            display:flex;
            justify-content:space-between;
            margin-bottom:15px;
            font-size:14px;
        }

        .top a {
            text-decoration:none;
            color:#1565c0;
            font-weight:bold;
        }
    </style>
</head>

<body>

<div class="card">

    <div class="top">
        <span>Crear cuenta</span>
        <a th:href="@{/login}">Login</a>
    </div>

    <h2>Registro</h2>

    <form th:action="@{/register}" th:object="${usuarios}" method="post">

        <div class="input-group">
            <input type="text" th:field="*{nombreUsuario}" placeholder="Nombre">
            <p class="error-text" th:errors="*{nombreUsuario}"></p>
        </div>

        <div class="input-group">
            <input type="text" th:field="*{apellidoUsuario}" placeholder="Apellido">
            <p class="error-text" th:errors="*{apellidoUsuario}"></p>
        </div>

        <div class="input-group">
            <input type="number" th:field="*{edadUsuario}" placeholder="Edad">
            <p class="error-text" th:errors="*{edadUsuario}"></p>
        </div>

        <div class="input-group">
            <input type="text" th:field="*{telefonoUsuario}" placeholder="Teléfono">
            <p class="error-text" th:errors="*{telefonoUsuario}"></p>
        </div>

        <div class="input-group">
            <input type="email" th:field="*{email}" placeholder="Email">
            <p class="error-text" th:errors="*{email}"></p>
        </div>

        <div class="input-group">
            <input type="password" th:field="*{password}" placeholder="Password">
            <p class="error-text" th:errors="*{password}"></p>
        </div>

        <button type="submit" class="btn btn-guardar">Registrar</button>

        <a th:href="@{/login}" class="btn-volver">Volver al login</a>

    </form>

</div>

</body>
</html>
