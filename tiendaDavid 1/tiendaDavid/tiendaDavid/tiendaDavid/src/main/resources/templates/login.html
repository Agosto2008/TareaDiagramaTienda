<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Login</title>

    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            margin:0;

            background: linear-gradient(135deg,#0f2027,#203a43,#2c5364);
        }

        /* CARD IGUAL A TODO EL SISTEMA */
        .card {
            width:350px;
            padding:30px;
            border-radius:16px;

            background: rgba(255,255,255,0.95);
            box-shadow:0 10px 30px rgba(0,0,0,0.4);
        }

        /* TITULO */
        h1 {
            text-align:center;
            color:#1565c0;
            margin-bottom:20px;
        }

        /* LINKS */
        .top {
            display:flex;
            justify-content:space-between;
            margin-bottom:15px;
            font-size:14px;
        }

        .top a {
            text-decoration:none;
            color:#1565c0;
            font-weight:bold;
        }

        /* INPUTS */
        input {
            width:100%;
            padding:12px;
            margin-bottom:15px;
            border-radius:8px;
            border:1px solid #ccc;
        }

        /* BOTON IGUAL QUE USUARIOS */
        button {
            width:100%;
            padding:12px;
            border:none;
            border-radius:8px;

            background: linear-gradient(45deg,#1e88e5,#1565c0);
            color:white;
            font-weight:bold;
            cursor:pointer;

            transition:0.3s;
        }

        button:hover {
            transform:scale(1.05);
        }

        /* MENSAJES */
        .error {
            color:#e53935;
            font-size:13px;
            margin-bottom:10px;
            text-align:center;
        }

        .success {
            color:#4caf50;
            font-size:13px;
            margin-bottom:10px;
            text-align:center;
        }
    </style>
</head>

<body>

<div class="card">

    <div class="top">
        <span>Bienvenido</span>
        <a th:href="@{/register}">Registrarse</a>
    </div>

    <h1>Iniciar Sesión</h1>

    <p class="error" th:if="${param.error}">
        Usuario o contraseña incorrectos
    </p>

    <p class="success" th:if="${param.logout}">
        Sesión cerrada correctamente
    </p>

    <form th:action="@{/login}" method="post">

        <input type="text" name="username" placeholder="Nombre de usuario" required>

        <input type="password" name="password" placeholder="Password" required>

        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

        <button type="submit">Ingresar</button>

    </form>

</div>

</body>
</html>
