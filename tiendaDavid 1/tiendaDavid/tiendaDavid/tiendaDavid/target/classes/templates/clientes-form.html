<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Clientes</title>

    <style>
        body {
            font-family: 'Segoe UI';
            background: linear-gradient(135deg,#0f2027,#203a43,#2c5364);
            display:flex;
            justify-content:center;
            align-items:center;
            height:100vh;
        }

        .card {
            background: rgba(255,255,255,0.95);
            padding:30px;
            border-radius:16px;
            width:400px;
        }

        input {
            width:100%;
            padding:12px;
            margin-bottom:10px;
            border-radius:8px;
            border:1px solid #ccc;
        }

        button {
            width:100%;
            padding:12px;
            background:#1565c0;
            color:white;
            border:none;
            border-radius:8px;
        }

        .btn-volver {
            display:block;
            text-align:center;
            margin-top:10px;
            color:white;
            background:gray;
            padding:10px;
            border-radius:8px;
            text-decoration:none;
        }
    </style>
</head>

<body>

<div class="card">

    <h2 th:text="${modoEdicion}? 'Editar Cliente':'Nuevo Cliente'"></h2>

    <form th:object="${clientes}" method="post"
          th:action="${modoEdicion}? @{/clientes/actualizar/{id}(id=${clientes.id})} : @{/clientes/guardar}">

        <input type="hidden" th:field="*{id}"/>

        <input type="text" placeholder="Nombre" th:field="*{nombre}" required>
        <input type="text" placeholder="Apellido" th:field="*{apellido}" required>

        <button type="submit"
                th:text="${modoEdicion}? 'Actualizar':'Guardar'"></button>

        <a th:href="@{/clientes/lista}" class="btn-volver">Volver</a>

    </form>

</div>

</body>
</html>
