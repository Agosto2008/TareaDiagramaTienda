<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Usuarios</title>

    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            margin:0;
            padding:40px;
            background: linear-gradient(135deg,#0f2027,#203a43,#2c5364);
        }

        h1 {
            text-align:center;
            color:white;
            margin-bottom:25px;
        }

        .card {
            background: rgba(255,255,255,0.95);
            border-radius:16px;
            padding:25px;
            box-shadow:0 10px 30px rgba(0,0,0,0.3);
        }

        .btn {
            padding:10px 18px;
            border-radius:8px;
            color:white;
            text-decoration:none;
            font-weight:bold;
            margin-right:5px;
        }

        .btn-nuevo { background:#1e88e5; }
        .btn-editar { background:#42a5f5; }
        .btn-eliminar { background:#e53935; }
        .btn-regreso { background:#4caf50; }

        table {
            width:100%;
            margin-top:20px;
            border-collapse:collapse;
        }

        th, td {
            padding:12px;
            text-align:center;
        }

        th {
            background:#1565c0;
            color:white;
        }

        tr:nth-child(even) {
            background:#f5f5f5;
        }
    </style>
</head>

<body>

<h1>Lista de Usuarios</h1>

<div class="card">

    <a th:href="@{/usuarios/nuevo}" class="btn btn-nuevo">+ Nuevo Usuario</a>

    <table>
        <tr>
            <th>ID</th>
            <th>Username</th>
            <th>Email</th>
            <th>Rol</th>
            <th>Estado</th>
            <th>Acciones</th>
        </tr>

        <tr th:each="usuario : ${usuarios}">
            <td th:text="${usuario.codigoUsuario}"></td>
            <td th:text="${usuario.username}"></td>
            <td th:text="${usuario.email}"></td>
            <td th:text="${usuario.rol}"></td>
            <td th:text="${usuario.estado} ? 'Activo' : 'Inactivo'"></td>
            <td>
                <!-- CORREGIDO: /editar → /actualizar -->
                <a th:href="@{/usuarios/actualizar/{id}(id=${usuario.codigoUsuario})}"
                   class="btn btn-editar">Editar</a>
                <a th:href="@{/usuarios/eliminar/{id}(id=${usuario.codigoUsuario})}"
                   class="btn btn-eliminar"
                   onclick="return confirm('¿Eliminar usuario?')">Eliminar</a>
            </td>
        </tr>

    </table>

    <br>
    <a th:href="@{/home}" class="btn btn-regreso">Volver</a>

</div>

</body>
</html>
